name: Release plugins

on:
  push:
    branches: [main]
    paths: ["Plugins/**", "tools/**", ".github/workflows/release.yml"]
  pull_request:
    paths: ["Plugins/**", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the plugin
        run: python3 tools/build-manifest.py
      - name: Run the plugin against a simulated keyboard
        run: python3 tools/test-plugin.py build/zh9-t9.clinkplugin
      - name: Check manifest is current
        run: git diff --exit-code manifest.json

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-manifest.py
      - name: Publish a permanent plugin release
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          shopt -s nullglob
          assets=(build/*.clinkplugin manifest.json)
          tag=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [ "$draft" = true ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false --latest
            else
              gh release edit "$tag" --latest
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "Latest plugins" --draft
            gh release edit "$tag" --draft=false --latest
          fi
